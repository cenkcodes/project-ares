version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: project-ares-db
    restart: always

    environment:
      POSTGRES_DB: projectares
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: